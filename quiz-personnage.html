<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quel Personnage de Jeu Vidéo Es-Tu ?</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Outfit:wght@300;400;600;800&display=swap');

:root {
  --bg-deep: #0a0a0f;
  --bg-card: #12121c;
  --bg-card-hover: #1a1a2e;
  --neon-cyan: #00f0ff;
  --neon-magenta: #ff00aa;
  --neon-gold: #ffd000;
  --neon-green: #00ff88;
  --text-primary: #e8e6f0;
  --text-dim: #6b6888;
  --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.4), 0 0 60px rgba(0, 240, 255, 0.15);
  --glow-magenta: 0 0 20px rgba(255, 0, 170, 0.4), 0 0 60px rgba(255, 0, 170, 0.15);
  --glow-gold: 0 0 20px rgba(255, 208, 0, 0.4), 0 0 60px rgba(255, 208, 0, 0.15);
  --radius: 6px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  position: relative;
}

/* Scanline overlay */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0, 0, 0, 0.08) 2px,
    rgba(0, 0, 0, 0.08) 4px
  );
  pointer-events: none;
  z-index: 9999;
}

/* Animated background grid */
.bg-grid {
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 60px 60px;
  animation: gridShift 20s linear infinite;
  z-index: 0;
}

@keyframes gridShift {
  0% { transform: perspective(500px) rotateX(0deg) translateY(0); }
  100% { transform: perspective(500px) rotateX(0deg) translateY(60px); }
}

/* Floating particles */
.particle {
  position: fixed;
  width: 3px;
  height: 3px;
  border-radius: 50%;
  pointer-events: none;
  z-index: 1;
  animation: particleFloat linear infinite;
  opacity: 0;
}

@keyframes particleFloat {
  0% { transform: translateY(100vh) scale(0); opacity: 0; }
  10% { opacity: 1; }
  90% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(1); opacity: 0; }
}

.container {
  position: relative;
  z-index: 10;
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 20px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* ── INTRO SCREEN ── */
.intro {
  text-align: center;
  animation: fadeInUp 0.8s ease-out;
}

.intro h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(16px, 4vw, 28px);
  line-height: 1.8;
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-magenta));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 16px;
  text-shadow: none;
  filter: drop-shadow(0 0 30px rgba(0, 240, 255, 0.3));
}

.intro .subtitle {
  font-size: 18px;
  color: var(--text-dim);
  font-weight: 300;
  letter-spacing: 0.5px;
  margin-bottom: 40px;
}

.intro .character-preview {
  font-size: 40px;
  letter-spacing: 12px;
  margin-bottom: 48px;
  animation: characterBounce 3s ease-in-out infinite;
  filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.5));
}

@keyframes characterBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

.btn-start {
  font-family: 'Press Start 2P', monospace;
  font-size: 14px;
  padding: 20px 48px;
  background: transparent;
  color: var(--neon-cyan);
  border: 2px solid var(--neon-cyan);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 2px;
}

.btn-start::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--neon-cyan);
  transform: translateX(-101%);
  transition: transform 0.4s ease;
  z-index: -1;
}

.btn-start:hover {
  color: var(--bg-deep);
  box-shadow: var(--glow-cyan);
}

.btn-start:hover::before {
  transform: translateX(0);
}

/* ── PROGRESS BAR ── */
.progress-container {
  width: 100%;
  margin-bottom: 40px;
  animation: fadeInUp 0.5s ease-out;
}

.progress-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 10px;
}

.progress-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--neon-cyan);
  letter-spacing: 1px;
}

.progress-count {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--text-dim);
}

.progress-bar {
  width: 100%;
  height: 4px;
  background: rgba(255, 255, 255, 0.06);
  overflow: hidden;
  position: relative;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
  transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
}

.progress-fill::after {
  content: '';
  position: absolute;
  right: 0;
  top: -3px;
  width: 10px;
  height: 10px;
  background: var(--neon-magenta);
  border-radius: 50%;
  box-shadow: var(--glow-magenta);
}

/* ── QUESTION CARD ── */
.question-card {
  width: 100%;
  animation: questionEnter 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

.question-card.exiting {
  animation: questionExit 0.3s ease-in forwards;
}

@keyframes questionEnter {
  0% { opacity: 0; transform: translateX(60px) scale(0.95); }
  100% { opacity: 1; transform: translateX(0) scale(1); }
}

@keyframes questionExit {
  0% { opacity: 1; transform: translateX(0) scale(1); }
  100% { opacity: 0; transform: translateX(-60px) scale(0.95); }
}

.question-number {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  color: var(--neon-magenta);
  margin-bottom: 12px;
  letter-spacing: 2px;
}

.question-text {
  font-size: 22px;
  font-weight: 600;
  line-height: 1.5;
  margin-bottom: 32px;
  color: var(--text-primary);
}

.choices {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.choice-btn {
  width: 100%;
  padding: 18px 24px;
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: var(--text-primary);
  font-family: 'Outfit', sans-serif;
  font-size: 16px;
  font-weight: 400;
  text-align: left;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 16px;
}

.choice-btn .choice-key {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--text-dim);
  min-width: 20px;
  transition: color 0.3s;
}

.choice-btn::before {
  content: '';
  position: absolute;
  left: 0;
  top: 0;
  width: 3px;
  height: 100%;
  background: var(--neon-cyan);
  transform: scaleY(0);
  transition: transform 0.3s ease;
}

.choice-btn:hover {
  background: var(--bg-card-hover);
  border-color: rgba(0, 240, 255, 0.2);
  transform: translateX(6px);
}

.choice-btn:hover::before {
  transform: scaleY(1);
}

.choice-btn:hover .choice-key {
  color: var(--neon-cyan);
}

.choice-btn.selected {
  background: rgba(0, 240, 255, 0.08);
  border-color: var(--neon-cyan);
  box-shadow: var(--glow-cyan);
}

.choice-btn.selected::before {
  transform: scaleY(1);
  background: var(--neon-gold);
}

.choice-btn.selected .choice-key {
  color: var(--neon-gold);
}

/* ── RESULT SCREEN ── */
.result-screen {
  width: 100%;
  text-align: center;
  animation: resultReveal 1s ease-out;
}

@keyframes resultReveal {
  0% { opacity: 0; transform: scale(0.8); filter: blur(10px); }
  50% { opacity: 1; filter: blur(0); }
  100% { transform: scale(1); }
}

.result-badge {
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  color: var(--neon-gold);
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 24px;
  animation: pulseBadge 2s ease-in-out infinite;
}

@keyframes pulseBadge {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.5; }
}

.result-portrait {
  font-size: 80px;
  margin-bottom: 24px;
  animation: portraitFloat 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 32px rgba(0, 240, 255, 0.3));
  position: relative;
}

.result-portrait-img {
  width: 180px;
  height: 180px;
  object-fit: cover;
  border-radius: 50%;
  border: 3px solid var(--neon-cyan);
  box-shadow: var(--glow-cyan), inset 0 0 30px rgba(0, 240, 255, 0.1);
  animation: portraitFloat 3s ease-in-out infinite;
  transition: opacity 0.6s ease;
}

.result-portrait-emoji {
  font-size: 80px;
  transition: opacity 0.4s ease;
}

.result-portrait-loading {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 3px solid rgba(0, 240, 255, 0.2);
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 60px;
  background: var(--bg-card);
  position: relative;
  overflow: hidden;
}

.result-portrait-loading::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 3px solid transparent;
  border-top-color: var(--neon-cyan);
  animation: spinLoader 1s linear infinite;
}

@keyframes spinLoader {
  to { transform: rotate(360deg); }
}

.wiki-section {
  background: var(--bg-card);
  border: 1px solid rgba(0, 240, 255, 0.15);
  border-left: 3px solid var(--neon-cyan);
  padding: 20px 24px;
  margin-bottom: 24px;
  text-align: left;
  position: relative;
}

.wiki-section .wiki-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--neon-cyan);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.wiki-section .wiki-label img {
  width: 20px;
  height: 20px;
}

.wiki-section .wiki-text {
  font-size: 14px;
  line-height: 1.7;
  color: var(--text-primary);
  opacity: 0.85;
}

.wiki-section .wiki-link {
  display: inline-block;
  margin-top: 12px;
  font-size: 12px;
  color: var(--neon-cyan);
  text-decoration: none;
  opacity: 0.7;
  transition: opacity var(--transition);
}

.wiki-section .wiki-link:hover {
  opacity: 1;
  text-decoration: underline;
}

@keyframes portraitFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-6px) rotate(1deg); }
  75% { transform: translateY(4px) rotate(-1deg); }
}

.result-name {
  font-family: 'Press Start 2P', monospace;
  font-size: clamp(18px, 5vw, 32px);
  background: linear-gradient(135deg, var(--neon-cyan), var(--neon-gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin-bottom: 8px;
  filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.3));
}

.result-game {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 32px;
  font-weight: 300;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.result-card {
  background: var(--bg-card);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 32px;
  text-align: left;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}

.result-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta), var(--neon-gold));
}

.result-description {
  font-size: 16px;
  line-height: 1.8;
  color: var(--text-primary);
  margin-bottom: 24px;
  font-weight: 300;
}

.result-traits {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}

.trait-tag {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  padding: 8px 14px;
  border: 1px solid rgba(0, 240, 255, 0.3);
  color: var(--neon-cyan);
  letter-spacing: 1px;
  text-transform: uppercase;
}

.result-quote {
  border-left: 3px solid var(--neon-magenta);
  padding: 16px 20px;
  font-style: italic;
  color: var(--text-dim);
  font-size: 15px;
  line-height: 1.6;
  background: rgba(255, 0, 170, 0.03);
}

.result-quote .quote-attr {
  display: block;
  margin-top: 8px;
  font-style: normal;
  font-size: 11px;
  color: var(--neon-magenta);
  font-family: 'Press Start 2P', monospace;
}

/* ── EXTRA INFO CARDS ── */
.result-extras {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 24px;
}

.extra-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid rgba(255, 255, 255, 0.06);
  padding: 16px;
  text-align: left;
  position: relative;
  overflow: hidden;
}

.extra-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 3px;
  height: 100%;
  background: var(--neon-cyan);
}

.extra-card.magenta::before { background: var(--neon-magenta); }
.extra-card.gold::before { background: var(--neon-gold); }
.extra-card.green::before { background: var(--neon-green); }

.extra-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: var(--text-dim);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.extra-value {
  font-size: 14px;
  color: var(--text-primary);
  font-weight: 400;
  line-height: 1.5;
}

.result-funfact {
  background: rgba(255, 208, 0, 0.03);
  border: 1px solid rgba(255, 208, 0, 0.15);
  padding: 20px 24px;
  margin-top: 24px;
  text-align: left;
  position: relative;
}

.result-funfact::before {
  content: '💡';
  position: absolute;
  top: -12px;
  left: 16px;
  font-size: 20px;
  background: var(--bg-deep);
  padding: 0 8px;
}

.funfact-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--neon-gold);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.funfact-text {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.7;
  font-weight: 300;
}

.result-weakness {
  background: rgba(255, 0, 170, 0.03);
  border: 1px solid rgba(255, 0, 170, 0.15);
  padding: 20px 24px;
  margin-top: 16px;
  text-align: left;
  position: relative;
}

.result-weakness::before {
  content: '⚠️';
  position: absolute;
  top: -12px;
  left: 16px;
  font-size: 20px;
  background: var(--bg-deep);
  padding: 0 8px;
}

.weakness-label {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--neon-magenta);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.weakness-text {
  font-size: 14px;
  color: var(--text-primary);
  line-height: 1.7;
  font-weight: 300;
}

@media (max-width: 600px) {
  .result-extras { grid-template-columns: 1fr; }
}

.score-bar-container {
  margin-top: 32px;
  text-align: left;
}

.score-bar-title {
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--text-dim);
  margin-bottom: 16px;
  letter-spacing: 2px;
}

.score-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  opacity: 0;
  animation: scoreReveal 0.4s ease-out forwards;
}

.score-row .score-char {
  font-size: 12px;
  min-width: 100px;
  text-align: right;
  color: var(--text-dim);
  font-weight: 300;
}

.score-row .score-bar-bg {
  flex: 1;
  height: 6px;
  background: rgba(255, 255, 255, 0.04);
  overflow: hidden;
}

.score-row .score-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
  transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
  width: 0;
}

.score-row.winner .score-char {
  color: var(--neon-gold);
  font-weight: 600;
}

.score-row.winner .score-bar-fill {
  background: linear-gradient(90deg, var(--neon-gold), var(--neon-cyan));
}

.score-row .score-pct {
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  color: var(--text-dim);
  min-width: 36px;
}

@keyframes scoreReveal {
  from { opacity: 0; transform: translateX(-10px); }
  to { opacity: 1; transform: translateX(0); }
}

.btn-restart {
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  padding: 16px 40px;
  margin-top: 40px;
  background: transparent;
  color: var(--neon-magenta);
  border: 2px solid var(--neon-magenta);
  cursor: pointer;
  transition: var(--transition);
  text-transform: uppercase;
  letter-spacing: 2px;
  position: relative;
  overflow: hidden;
}

.btn-restart::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--neon-magenta);
  transform: translateX(-101%);
  transition: transform 0.4s ease;
  z-index: -1;
}

.btn-restart:hover {
  color: var(--bg-deep);
  box-shadow: var(--glow-magenta);
}

.btn-restart:hover::before {
  transform: translateX(0);
}

/* ── UTILITIES ── */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}

.hidden { display: none !important; }

/* ── MOBILE ── */
@media (max-width: 600px) {
  .container { padding: 24px 16px; }
  .question-text { font-size: 18px; }
  .choice-btn { padding: 14px 16px; font-size: 14px; }
  .result-card { padding: 24px 18px; }
  .result-portrait-emoji { font-size: 60px; }
  .result-portrait-img { width: 140px; height: 140px; }
  .result-portrait-loading { width: 140px; height: 140px; font-size: 50px; }
  .score-row .score-char { min-width: 70px; font-size: 11px; }
}
</style>
</head>
<body>

<div class="bg-grid"></div>
<div id="particles"></div>

<div class="container">
  <!-- INTRO -->
  <div id="intro" class="intro">
    <div class="character-preview">⚔️🎮🛡️🔫🗡️🏹💙🥷</div>
    <h1>Quel Personnage<br>de Jeu Vidéo<br>Es-Tu ?</h1>
    <p class="subtitle">20 questions aléatoires parmi 50+ pour révéler le héros qui sommeille en toi</p>
    <button class="btn-start" onclick="startQuiz()">Commencer</button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="hidden" style="width:100%">
    <div class="progress-container">
      <div class="progress-header">
        <span class="progress-label">Progression</span>
        <span class="progress-count" id="progressCount">1 / 15</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:6.66%"></div>
      </div>
    </div>
    <div id="questionArea" class="question-card"></div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden result-screen"></div>
</div>

<script>
const CHARACTERS = {
  mario: {
    name: "Mario",
    game: "Super Mario Bros.",
    emoji: "🍄",
    portrait: "👨‍🔧🍄⭐",
    description: "Tu es une personne optimiste, courageuse et infatigable. Quand un problème se présente, tu fonces tête baissée sans jamais te décourager. Tu as un grand cœur et tu es toujours prêt à aider ceux que tu aimes, même si cela signifie traverser des mondes entiers. Ta simplicité et ta détermination sont tes plus grandes forces.",
    traits: ["Optimiste", "Courageux", "Loyal", "Infatigable"],
    quote: "It's-a me, Mario!",
    quoteAttr: "— Mario",
    rival: "Sonic",
    ally: "Kirby",
    funFact: "Shigeru Miyamoto a nommé Mario d'après Mario Segale, le propriétaire de l'entrepôt de Nintendo of America qui est venu réclamer son loyer en retard.",
    soundtrack: "Super Mario Bros. Theme — Koji Kondo",
    element: "Feu 🔥",
    faiblesse: "Tu es trop naïf — tu fais confiance à tout le monde, même à ceux qui t'ont trahi cent fois."
  },
  link: {
    name: "Link",
    game: "The Legend of Zelda",

async function fetchWikiData(charKey) {
  const title = WIKI_MAP[charKey];
  if (!title) return {};
  // Essai FR puis EN
  for (const lang of ['fr', 'en']) {
    try {
      const resp = await fetch(
        `https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`,
        { headers: { 'Accept': 'application/json' } }
      );
      if (!resp.ok) continue;
      const data = await resp.json();
      if (data.thumbnail || data.extract) {
        return {
          image: data.thumbnail?.source || null,
          extract: data.extract || null,
          url: data.content_urls?.desktop?.page || null
        };
      }
    } catch(e) { /* silently fail */ }
  }
  return {};
}

const NUM_QUESTIONS = 12;

// Shuffle and pick N questions
function pickQuestions() {
  const shuffled = [...QUESTION_POOL];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, NUM_QUESTIONS);
}

let QUESTIONS = pickQuestions();

// ── STATE ──
let currentQuestion = 0;
let scores = {};
let transitioning = false;

function initScores() {
  scores = {};
  for (const key in CHARACTERS) scores[key] = 0;
}

// ── PARTICLES ──
function createParticles() {
  const container = document.getElementById('particles');
  const colors = ['var(--neon-cyan)', 'var(--neon-magenta)', 'var(--neon-gold)', 'var(--neon-green)'];
  for (let i = 0; i < 20; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = (Math.random() * 10) + 's';
    container.appendChild(p);
  }
}

// ── QUIZ FLOW ──
function startQuiz() {
  QUESTIONS = pickQuestions();
  initScores();
  currentQuestion = 0;
  document.getElementById('intro').classList.add('hidden');
  document.getElementById('quiz').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  const area = document.getElementById('questionArea');

  const pct = ((currentQuestion + 1) / QUESTIONS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressCount').textContent = (currentQuestion + 1) + ' / ' + QUESTIONS.length;

  area.innerHTML = `
    <div class="question-number">Question ${currentQuestion + 1}</div>
    <div class="question-text">${q.question}</div>
    <div class="choices">
      ${q.choices.map((c, i) => `
        <button class="choice-btn" onclick="selectAnswer(${i})" style="animation-delay: ${i * 0.08}s">
          <span class="choice-key">${String.fromCharCode(65 + i)}</span>
          <span>${c.text}</span>
        </button>
      `).join('')}
    </div>
  `;

  area.classList.remove('exiting');
  area.style.animation = 'none';
  area.offsetHeight;
  area.style.animation = '';
  area.classList.add('question-card');
}

function selectAnswer(index) {
  if (transitioning) return;
  transitioning = true;

  const q = QUESTIONS[currentQuestion];
  const choice = q.choices[index];

  // Apply scores
  for (const [char, pts] of Object.entries(choice.scores)) {
    scores[char] = (scores[char] || 0) + pts;
  }

  // Visual feedback
  const buttons = document.querySelectorAll('.choice-btn');
  buttons[index].classList.add('selected');
  buttons.forEach(b => b.style.pointerEvents = 'none');

  setTimeout(() => {
    const area = document.getElementById('questionArea');
    area.classList.add('exiting');

    setTimeout(() => {
      currentQuestion++;
      if (currentQuestion < QUESTIONS.length) {
        renderQuestion();
      } else {
        showResult();
      }
      transitioning = false;
    }, 300);
  }, 400);
}

async function showResult() {
  document.getElementById('quiz').classList.add('hidden');

  // Find winner
  let maxScore = 0;
  let winner = 'mario';
  for (const [char, score] of Object.entries(scores)) {
    if (score > maxScore) {
      maxScore = score;
      winner = char;
    }
  }

  const c = CHARACTERS[winner];

  // Top scores for display
  const sorted = Object.entries(scores)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 8);
  const topMax = sorted[0][1] || 1;

  const resultDiv = document.getElementById('result');
  resultDiv.classList.remove('hidden');
  resultDiv.innerHTML = `
    <div class="result-badge">★ Ton Personnage ★</div>
    <div class="result-portrait">
      <div class="result-portrait-loading" id="portraitContainer">
        <span class="result-portrait-emoji">${c.portrait}</span>
      </div>
    </div>
    <div class="result-name">${c.name}</div>
    <div class="result-game">${c.game}</div>

    <div class="result-card">
      <div class="result-description">${c.description}</div>
      <div class="result-traits">
        ${c.traits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
      </div>
      <div class="result-quote">
        "${c.quote}"
        <span class="quote-attr">${c.quoteAttr}</span>
      </div>

      <div class="result-extras">
        <div class="extra-card">
          <div class="extra-label">Élément</div>
          <div class="extra-value">${c.element || '???'}</div>
        </div>
        <div class="extra-card magenta">
          <div class="extra-label">Rival</div>
          <div class="extra-value">⚔️ ${c.rival || '???'}</div>
        </div>
        <div class="extra-card gold">
          <div class="extra-label">Meilleur allié</div>
          <div class="extra-value">🤝 ${c.ally || '???'}</div>
        </div>
        <div class="extra-card green">
          <div class="extra-label">Soundtrack</div>
          <div class="extra-value">🎵 ${c.soundtrack || '???'}</div>
        </div>
      </div>
    </div>

    <div id="wikiSection" class="wiki-section" style="display:none;">
      <div class="wiki-label">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.09 13.119c-.936 1.932-2.217 4.548-2.853 5.728-.616 1.074-1.127.931-1.532.029-1.406-3.321-4.293-9.144-5.651-12.409-.251-.601-.441-.987-.619-1.139-.181-.15-.554-.224-1.259-.224L0 4.943l.186-.186C.726 4.036 1.648 3.7 2.853 3.7c1.837 0 2.853.981 3.405 2.852l2.478 6.469c.418 1.076.793 1.564 1.123 1.564.366 0 .76-.479 1.189-1.437l2.645-5.561C13.861 5.539 14.517 3.7 16.282 3.7c1.178 0 2.037.341 2.55 1.057l.186.186-.162.162c-.705 0-1.078.074-1.259.224-.178.152-.367.538-.619 1.139-.377.901-.875 2.088-1.494 3.56L19.7 19.3c-.436.868-.945 1.019-1.532.029-.636-1.18-1.917-3.796-2.853-5.728-.423-.866-.793-1.652-1.112-2.358l-1.108 2.324c-.313.654-.604 1.177-.876 1.552z"/></svg>
        Selon Wikipédia
      </div>
      <div class="wiki-text" id="wikiText"></div>
      <a class="wiki-link" id="wikiLink" href="#" target="_blank" rel="noopener">Lire l'article complet →</a>
    </div>

    <div class="result-funfact">
      <div class="funfact-label">Le savais-tu ?</div>
      <div class="funfact-text">${c.funFact || ''}</div>
    </div>

    <div class="result-weakness">
      <div class="weakness-label">Ton talon d'Achille</div>
      <div class="weakness-text">${c.faiblesse || ''}</div>
    </div>

    <div class="score-bar-container">
      <div class="score-bar-title">Affinités</div>
      ${sorted.map(([key, val], i) => {
        const ch = CHARACTERS[key];
        const pct = Math.round((val / topMax) * 100);
        return `
          <div class="score-row ${i === 0 ? 'winner' : ''}" style="animation-delay: ${0.6 + i * 0.1}s">
            <span class="score-char">${ch.emoji} ${ch.name}</span>
            <div class="score-bar-bg">
              <div class="score-bar-fill" data-width="${pct}"></div>
            </div>
            <span class="score-pct">${pct}%</span>
          </div>
        `;
      }).join('')}
    </div>

    <button class="btn-restart" onclick="restart()">Recommencer</button>
  `;

  // Animate score bars
  setTimeout(() => {
    document.querySelectorAll('.score-bar-fill').forEach(bar => {
      bar.style.width = bar.dataset.width + '%';
    });
  }, 800);

  // Fetch Wikipedia data asynchronously
  try {
    const wikiData = await fetchWikiData(winner);
    const container = document.getElementById('portraitContainer');

    // Update portrait with Wikipedia image
    if (wikiData.image) {
      const img = new Image();
      img.onload = () => {
        container.innerHTML = '';
        container.className = '';
        img.className = 'result-portrait-img';
        img.alt = c.name;
        container.appendChild(img);
      };
      img.src = wikiData.image;
    } else {
      // Remove loading spinner, keep emoji
      container.className = '';
    }

    // Show Wikipedia extract
    if (wikiData.extract) {
      const wikiSection = document.getElementById('wikiSection');
      const wikiText = document.getElementById('wikiText');
      const wikiLink = document.getElementById('wikiLink');
      wikiText.textContent = wikiData.extract;
      if (wikiData.url) wikiLink.href = wikiData.url;
      wikiSection.style.display = 'block';
      wikiSection.style.animation = 'fadeInUp 0.6s ease-out';
    }
  } catch(e) {
    // Wikipedia failed silently — emoji stays
    const container = document.getElementById('portraitContainer');
    if (container) container.className = '';
  }
}

function restart() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('intro').classList.remove('hidden');
  document.getElementById('intro').style.animation = 'none';
  document.getElementById('intro').offsetHeight;
  document.getElementById('intro').style.animation = 'fadeInUp 0.8s ease-out';
}

// ── KEYBOARD SUPPORT ──
document.addEventListener('keydown', (e) => {
  if (transitioning) return;
  const key = e.key.toUpperCase();
  const map = { A: 0, B: 1, C: 2, D: 3 };
  if (key in map && !document.getElementById('quiz').classList.contains('hidden')) {
    const btns = document.querySelectorAll('.choice-btn');
    if (btns[map[key]]) selectAnswer(map[key]);
  }
  if (key === 'ENTER' && !document.getElementById('intro').classList.contains('hidden')) {
    startQuiz();
  }
});

// Init
createParticles();
</script>
</body>
</html>
